name: Build Android app

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.x
          cache: true

      - run: flutter pub get

      - name: Restore keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
            echo "KEYSTORE_PASSWORD=${{ secrets.ANDROID_KEYSTORE_PASSWORD }}" >> "$GITHUB_ENV"
            echo "KEY_ALIAS=${{ secrets.ANDROID_KEY_ALIAS }}" >> "$GITHUB_ENV"
            echo "KEY_PASSWORD=${{ secrets.ANDROID_KEY_PASSWORD }}" >> "$GITHUB_ENV"
          fi

      - run: >
          flutter build apk --release
          --dart-define=TURN_SERVER=${{ secrets.TURN_SERVER }}
          --dart-define=TURN_USERNAME=${{ secrets.TURN_USERNAME }}
          --dart-define=TURN_PASSWORD=${{ secrets.TURN_PASSWORD }}

      - run: >
          flutter build appbundle --release
          --dart-define=TURN_SERVER=${{ secrets.TURN_SERVER }}
          --dart-define=TURN_USERNAME=${{ secrets.TURN_USERNAME }}
          --dart-define=TURN_PASSWORD=${{ secrets.TURN_PASSWORD }}

      - uses: actions/upload-artifact@v4
        with:
          name: bingownia-android
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
